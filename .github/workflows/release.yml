name: Release

# On every push to main: when VERSION names a release that doesn't exist yet,
# publishes it with the scripts zipped up.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          mkdir -p "dist/gpu-warning-patch"
          cp Patch-GpuMemWarning.ps1 README.md LICENSE "dist/gpu-warning-patch/"
          (cd dist && zip -r "../gpu-warning-patch-$tag.zip" "gpu-warning-patch")
          gh release create "$tag" "gpu-warning-patch-$tag.zip" --title "gpu-warning-patch $tag" --generate-notes --target "$GITHUB_SHA"
